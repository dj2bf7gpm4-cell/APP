plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.shellmcp'
    compileSdk 34

    defaultConfig {
        applicationId "dev.shellmcp"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 debug 签名，assembleRelease 也能直接装；正式发布请换成自己的签名
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
